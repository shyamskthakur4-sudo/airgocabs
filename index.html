    <!-- AIRGOCABS Preloader Styles -->
    <style>
      .no-scroll {

      #airgo-preloader {
        position: fixed;
        inset: 0;
        background: #FFFFFF;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;

      #airgo-preloader.is-hidden {

        100% { opacity: 0; transform: scale(1.5); visibility: hidden; }
      }

      @keyframes airgoFadeScale {
        0% { opacity: 0; transform: scale(0.5); }

      .car-track {

      .car-container {

        display: block;

        100% { transform: translateX(100vw); }
      }

    <!-- AIRGOCABS Preloader Exit Sequence -->
    <script>
      (function () {
        var dismissed = false;
        function hidePreloader() {
          if (dismissed) return;
          dismissed = true;
          var preloader = document.getElementById('airgo-preloader');
          if (preloader) {
            preloader.classList.add('is-hidden');
            document.body.classList.remove('no-scroll');
            window.dispatchEvent(new Event('airgo:preloader-exit'));
            setTimeout(function () {
              preloader.remove();
            }, 600);
          } else {
            document.body.classList.remove('no-scroll');
            window.dispatchEvent(new Event('airgo:preloader-exit'));
          }
        }

        function scheduleHide() {
          setTimeout(hidePreloader, 2000);
        }

        if (document.readyState === 'complete') {
          scheduleHide();
        } else {
          window.addEventListener('load', scheduleHide);
          // Safety fallback in case an external asset loads slowly
          setTimeout(hidePreloader, 3500);
        }
      })();
    </script>
